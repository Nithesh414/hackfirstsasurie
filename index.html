
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Management System</title>

<style>

body{
background: linear-gradient(135deg,#2563eb,#1e3a8a);
min-height:100vh;
padding:15px;
font-family:Arial,sans-serif;
}

/* CONTAINER */

.container{
width:100%;
max-width:1100px;
margin:auto;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:18px;
border-radius:20px;
box-shadow:0 8px 30px rgba(0,0,0,0.2);
margin-top:20px;
overflow:hidden;
}

/* TOP BAR */

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:10px;
flex-wrap:wrap;
}

.top-bar h1,
.top-bar h2{
font-size:22px;
color:#1e3a8a;
}

/* BUTTON */

button{
padding:10px 16px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:14px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1e40af;
transform:scale(1.03);
}

/* LAB CARDS */

.labs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.lab-card{
background:white;
padding:25px 15px;
border-radius:15px;
text-align:center;
font-weight:bold;
color:#1e3a8a;
cursor:pointer;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
border:2px solid transparent;
}

.lab-card:hover{
background:#2563eb;
color:white;
transform:translateY(-5px);
}

/* TIMETABLE */

.table-container{
overflow-x:auto;
border-radius:15px;
}

table{
width:100%;
border-collapse:separate;
border-spacing:0;
min-width:700px;
overflow:hidden;
}

th{
background:#2563eb;
color:white;
padding:14px;
font-size:14px;
position:sticky;
top:0;
}

td{
padding:14px;
background:#f8fafc;
text-align:center;
border-bottom:1px solid #e2e8f0;
font-size:13px;
transition:0.3s;
}

td:hover{
background:#dbeafe;
}

/* ALLOCATED */

.allocated{
background:#22c55e !important;
color:white;
font-weight:bold;
}

/* HISTORY BUTTONS */

.action-btn{
padding:8px 12px;
font-size:12px;
border-radius:8px;
margin:2px;
}

.edit-btn{
background:#f59e0b;
}

.delete-btn{
background:#ef4444;
}

/* MOBILE HISTORY CARD VIEW */

@media(max-width:768px){

body{
padding:10px;
}

.container{
padding:15px;
border-radius:18px;
}

.top-bar{
flex-direction:column;
align-items:flex-start;
}

.top-bar h1,
.top-bar h2{
font-size:20px;
}

.labs{
grid-template-columns:1fr;
}

.lab-card{
padding:20px;
}

/* HISTORY MOBILE */

#historyPage table,
#historyPage thead,
#historyPage tbody,
#historyPage th,
#historyPage td,
#historyPage tr{
display:block;
width:100%;
}

#historyPage thead{
display:none;
}

#historyPage tr{
background:white;
margin-bottom:15px;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

#historyPage td{
display:flex;
justify-content:space-between;
padding:10px 0;
border:none;
font-size:14px;
}

#historyPage td::before{
font-weight:bold;
color:#1e3a8a;
}

/* LABELS */

#historyPage td:nth-child(1)::before{
content:'Faculty';
}

#historyPage td:nth-child(2)::before{
content:'Subject';
}

#historyPage td:nth-child(3)::before{
content:'Lab';
}

#historyPage td:nth-child(4)::before{
content:'Day';
}

#historyPage td:nth-child(5)::before{
content:'Period';
}

#historyPage td:nth-child(6)::before{
content:'Date';
}

#historyPage td:nth-child(7)::before{
content:'Edit';
}

#historyPage td:nth-child(8)::before{
content:'Delete';
}

/* TIMETABLE */

table{
min-width:650px;
}

td{
padding:12px 8px;
font-size:12px;
}

button{
width:100%;
}

}


*{
margin:0;
padding:0;
box-sizing:border-box;
}

.hidden{
display:none;
}

.login-box{
max-width:400px;
margin-top:100px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#f1f5f9;
font-size:15px;
outline:none;
}

/* BETTER MOBILE TIMETABLE */

@media(max-width:768px){

.table-container{
overflow-x:auto;
-webkit-overflow-scrolling:touch;
}

table{
min-width:900px;
}

th{
font-size:12px;
padding:10px;
}

td{
font-size:11px;
padding:10px 6px;
min-width:120px;
}

/* TIMETABLE TEXT */

.allocated{
font-size:10px;
line-height:1.4;
}

/* BUTTON FIX */

button{
width:auto;
font-size:13px;
padding:10px 14px;
}

/* HISTORY ACTION BUTTONS */

.action-btn{
width:90px;
font-size:12px;
}

}




</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="container login-box" id="loginPage">

<h1>Faculty Login</h1>

<input type="email" id="email" placeholder="Enter faculty name">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

</div>

<!-- DASHBOARD -->
<div class="container hidden" id="dashboardPage">

<div class="top-bar">
<h1>Select Department</h1>
<button onclick="logout()">Logout</button>
</div>

<div id="departments" class="labs"></div>

<br>

<button onclick="showHistory()">View Booking History</button>

</div>

<!-- LABS -->
<div class="container hidden" id="labsPage">

<div class="top-bar">
<h1 id="deptTitle">Select Lab</h1>
<button onclick="backToDashboard()">Back</button>
</div>

<div id="labs" class="labs"></div>

</div>

<!-- TIMETABLE -->
<div class="container hidden" id="timetablePage">

<div class="top-bar">
<h2 id="labTitle">Lab Timetable</h2>
<button onclick="backToLabs()">Back</button>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>Period</th>
<th>Mon</th>
<th>Tue</th>
<th>Wed</th>
<th>Thu</th>
<th>Fri</th>
<th>Sat</th>
</tr>
</thead>
<tbody id="calendarBody"></tbody>
</table>
</div>

</div>

<!-- HISTORY -->
<div class="container hidden" id="historyPage">

<div class="top-bar">
<h2>Booking History</h2>
<button onclick="backToDashboard()">Back</button>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>Faculty</th>
<th>Subject</th>
<th>Lab</th>
<th>Day</th>
<th>Period</th>
<th>Date</th>
<th>Edit</th>
<th>Delete</th>

</tr>
</thead>
<tbody id="historyBody"></tbody>



</table>
</div>

</div>

<script>
// =============================
// DUMMY DATA
// =============================

const departments = {
    "CSE": ["CSE Lab 1", "CSE Lab 2", "AI Lab"],
    "ECE": ["Embedded Lab", "VLSI Lab"],
    "EEE": ["Electrical Lab", "Machines Lab"],
    "MECH": ["CAD Lab", "Thermal Lab"]
};

const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const periods = [1,2,3,4,5,6,7];

let selectedDepartment = "";
let selectedLab = "";

// =============================
// LOGIN
// =============================

function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(email && password){

        localStorage.setItem("faculty", email);

        showPage("dashboardPage");

        loadDepartments();

    }else{
        alert("Please enter email and password");
    }
}

function logout(){
    localStorage.clear();
    location.reload();
}

// =============================
// PAGE CONTROL
// =============================

function hideAllPages(){

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboardPage").classList.add("hidden");
    document.getElementById("labsPage").classList.add("hidden");
    document.getElementById("timetablePage").classList.add("hidden");
    document.getElementById("historyPage").classList.add("hidden");
}

function showPage(pageId){

    hideAllPages();

    document.getElementById(pageId).classList.remove("hidden");
}

// =============================
// LOAD DEPARTMENTS
// =============================

function loadDepartments(){

    const container = document.getElementById("departments");

    container.innerHTML = "";

    Object.keys(departments).forEach(dept => {

        const card = document.createElement("div");

        card.className = "lab-card";

        card.innerHTML = dept;

        card.onclick = () => {
            selectedDepartment = dept;
            showLabs();
        };

        container.appendChild(card);
    });
}

// =============================
// SHOW LABS
// =============================

function showLabs(){

    showPage("labsPage");

    document.getElementById("deptTitle").innerText = selectedDepartment + " Labs";

    const labsContainer = document.getElementById("labs");

    labsContainer.innerHTML = "";

    departments[selectedDepartment].forEach(lab => {

        const card = document.createElement("div");

        card.className = "lab-card";

        card.innerHTML = lab;

        card.onclick = () => {
            selectedLab = lab;
            buildCalendar();
        };

        labsContainer.appendChild(card);
    });
}

// =============================
// BUILD TIMETABLE
// =============================

function buildCalendar(){

    showPage("timetablePage");

    document.getElementById("labTitle").innerText = selectedLab;

    const tableBody = document.getElementById("calendarBody");

    tableBody.innerHTML = "";

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    periods.forEach(period => {

        const row = document.createElement("tr");

        const periodCell = document.createElement("td");
        periodCell.innerText = "P" + period;

        row.appendChild(periodCell);

        days.forEach(day => {

            const cell = document.createElement("td");

            const booking = bookings.find(
                b => b.lab === selectedLab && b.day === day && b.period === period
            );

            if(booking){

                cell.classList.add("allocated");
                cell.innerHTML = `
                    <b>${booking.subject}</b><br>
                    ${booking.faculty}
                `;

            }else{

                cell.innerHTML = "Available";

                cell.onclick = () => allocateLab(day, period, cell);
            }

            row.appendChild(cell);
        });

        tableBody.appendChild(row);
    });
}

// =============================
// ALLOCATE LAB
// =============================

function allocateLab(day, period, cell){

    const faculty = localStorage.getItem("faculty");

    const subject = prompt("Enter Subject Name");

    if(!subject) return;

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    const booking = {
        faculty,
        subject,
        lab: selectedLab,
        day,
        period,
        date: new Date().toLocaleDateString()
    };

    bookings.push(booking);

    localStorage.setItem("bookings", JSON.stringify(bookings));

    cell.classList.add("allocated");
    cell.innerHTML = `
        <b>${subject}</b><br>
        ${faculty}
    `;
    cell.onclick = null;

    alert("Lab allocated successfully");
}

// =============================
// HISTORY
// =============================

function showHistory(){

    showPage("historyPage");

    loadHistory();
}

function loadHistory(){

    const body = document.getElementById("historyBody");

    body.innerHTML = "";

    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings.slice().reverse().forEach(item => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${item.faculty}</td>
            <td>${item.subject}</td>
            <td>${item.lab}</td>
            <td>${item.day}</td>
            <td>${item.period}</td>
            <td>${item.date}</td>
        `;

        body.appendChild(row);
    });
}


// =============================
// NAVIGATION
// =============================

function backToDashboard(){
    showPage("dashboardPage");
}

function backToLabs(){
    showPage("labsPage");
}

// =============================
// AUTO LOGIN
// =============================

window.onload = function(){

    const faculty = localStorage.getItem("faculty");

    if(faculty){
        showPage("dashboardPage");
        loadDepartments();
    }
};

function showHistory(){

    showPage("historyPage");

    loadHistory();
}

function loadHistory(){

    const body = document.getElementById("historyBody");

    body.innerHTML = "";

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings.slice().reverse().forEach((item, index) => {

        const actualIndex = bookings.length - 1 - index;

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${item.faculty}</td>
            <td>${item.subject}</td>
            <td>${item.lab}</td>
            <td>${item.day}</td>
            <td>${item.period}</td>
            <td>${item.date}</td>

            <td>
                <button onclick="editBooking(${actualIndex})">
                    Edit
                </button>
            </td>

            <td>
                <button onclick="deleteBooking(${actualIndex})">
                    Delete
                </button>
            </td>
        `;

        body.appendChild(row);
    });
}

// =============================
// EDIT BOOKING
// =============================

function editBooking(index){

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    const booking = bookings[index];

    const newSubject = prompt(
        "Edit Subject Name",
        booking.subject
    );

    if(!newSubject) return;

    bookings[index].subject = newSubject;

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );

    loadHistory();

    alert("Booking updated successfully");
}

// =============================
// DELETE BOOKING
// =============================

function deleteBooking(index){

    const confirmDelete = confirm(
        "Are you sure you want to delete this booking?"
    );

    if(!confirmDelete) return;

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings.splice(index, 1);

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );

    loadHistory();

    alert("Booking deleted successfully");
}





</script>

</body>
</html>
